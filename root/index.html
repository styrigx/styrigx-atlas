<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>图志 · Styrigx's Atlas</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f6f8;
    color: #1c1c1e;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 32px; }
  header { margin-bottom: 28px; }
  h1 { margin: 0; font-size: 32px; line-height: 1.3; }
  .sub { margin: 4px 0 0; color: #6c6c70; font-size: 15px; }
  .intro { margin: 16px 0 0; color: #3a3a3c; font-size: 16px; }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .card a.main {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 16px;
    padding: 18px 20px;
  }
  .card a.main:active { background: #f0f0f2; }
  .card h2 { margin: 0; font-size: 19px; }
  .card h2 span { margin-left: 8px; font-size: 13px; font-weight: 400; color: #8a8a8e; }
  .card p { margin: 6px 0 0; font-size: 14px; color: #6c6c70; }
  .card .en { margin-top: 10px; font-size: 13px; }
  .card .en a { color: #0a84ff; text-decoration: none; }
  footer { margin-top: 32px; font-size: 14px; }
  footer a { color: #0a84ff; text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f2f2f7; }
    .sub, .card p { color: #98989d; }
    .intro { color: #d1d1d6; }
    .card a.main { background: #2c2c2e; border-color: #38383a; }
    .card a.main:active { background: #3a3a3c; }
    .card h2 span { color: #98989d; }
    .card .en a, footer a { color: #64aaff; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>图志</h1>
    <p class="sub">Styrigx's Atlas</p>
    <p class="intro">博客、奇趣、日刻：一个域名。</p>
  </header>
  <main>
    <ul class="cards">
      <li class="card">
        <a class="main" href="/blog/">
          <h2>博客 <span>Blog</span></h2>
          <p>AI 工具实战、开源项目复盘、个人基础设施笔记。</p>
        </a>
        <p class="en"><a href="/blog/en/">English →</a></p>
      </li>
      <li class="card">
        <a class="main" href="/curio/">
          <h2>奇趣 <span>Curio</span></h2>
          <p>网上偶然遇到、想留下的好东西：收藏、设备、游戏。</p>
        </a>
        <p class="en"><a href="/curio/en/">English →</a></p>
      </li>
      <li class="card">
        <a class="main" href="/daymark/">
          <h2>日刻 <span>Daymark</span></h2>
          <p>每天刻下一句值得记住的话。</p>
        </a>
        <p class="en"><a href="/daymark/en/">English →</a></p>
      </li>
    </ul>
  </main>
  <footer>
    <a href="https://styrigx.com">← 主站 styrigx.com</a>
  </footer>
</div>
</body>
</html>
